
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clear Path Quantum Background</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --neon-cyan: #18f0ff;
        --neon-fuchsia: #ff2bd6;
        --neon-green: #39ff14;
        --neon-indigo: #5b3df5;

        --text-main: rgba(255, 255, 255, 0.94);
        --text-muted: rgba(255, 255, 255, 0.66);

        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.09);
        --glass-highlight: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: var(--text-main);
        font-family: "Outfit", sans-serif;
      }

      body {
        position: relative;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        cursor: crosshair;
      }

      .overlay-dark {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div class="overlay-dark"></div>
    <canvas id="neural-network-canvas"></canvas>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const config = {
        paused: false,
        activePaletteIndex: 0,
        currentFormation: 0,
        numFormations: 3,
        densityFactor: 1
      };

      const colorPalettes = [
        [
          new THREE.Color(0x18f0ff),
          new THREE.Color(0xff2bd6),
          new THREE.Color(0x5b3df5),
          new THREE.Color(0x39ff14),
          new THREE.Color(0x18f0ff)
        ]
      ];

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.002);

      const camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 8, 28);

      const canvasElement = document.getElementById("neural-network-canvas");

      const renderer = new THREE.WebGLRenderer({
        canvas: canvasElement,
        antialias: true,
        powerPreference: "high-performance"
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      function createStarfield() {
        const count = 5000;
        const positions = [];
        const colors = [];
        const sizes = [];

        for (let i = 0; i < count; i++) {
          const r = THREE.MathUtils.randFloat(50, 150);
          const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
          const theta = THREE.MathUtils.randFloat(0, Math.PI * 2);

          positions.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
          );

          const colorChoice = Math.random();
          if (colorChoice < 0.55) colors.push(0.09, 0.94, 1.0);
          else if (colorChoice < 0.8) colors.push(1.0, 0.17, 0.84);
          else if (colorChoice < 0.93) colors.push(0.36, 0.24, 0.96);
          else colors.push(0.22, 1.0, 0.08);

          sizes.push(THREE.MathUtils.randFloat(0.08, 0.3));
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geo.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));

        const mat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            attribute float size;
            attribute vec3 color;
            varying vec3 vColor;
            uniform float uTime;
            void main() {
              vColor = color;
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              float twinkle = sin(uTime * 2.0 + position.x * 100.0) * 0.3 + 0.7;
              gl_PointSize = size * twinkle * (300.0 / -mvPosition.z);
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            void main() {
              vec2 center = gl_PointCoord - 0.5;
              float dist = length(center);
              if (dist > 0.5) discard;
              float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
              gl_FragColor = vec4(vColor, alpha * 0.85);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        return new THREE.Points(geo, mat);
      }

      const starField = createStarfield();
      scene.add(starField);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.6;
      controls.minDistance = 8;
      controls.maxDistance = 80;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.2;
      controls.enablePan = false;

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.6,
        0.6,
        0.8
      );
      composer.addPass(bloomPass);
      composer.addPass(new OutputPass());

      let nodesMesh = null;
      let connectionsMesh = null;

      function createNetworkVisualization(formationIndex = 0, densityFactor = 1) {
        if (nodesMesh) scene.remove(nodesMesh);
        if (connectionsMesh) scene.remove(connectionsMesh);

        const palette = colorPalettes[0];
        const nodeCount = Math.floor(520 * densityFactor);

        const positions = [];
        const colors = [];
        const nodeSizes = [];
        const linePositions = [];
        const lineColors = [];
        const nodeVectors = [];

        for (let i = 0; i < nodeCount; i++) {
          let x, y, z;
          const radius = THREE.MathUtils.randFloat(4, 13);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
          x = radius * Math.sin(phi) * Math.cos(theta);
          y = radius * Math.cos(phi) * 0.7;
          z = radius * Math.sin(phi) * Math.sin(theta);

          positions.push(x, y, z);
          nodeVectors.push(new THREE.Vector3(x, y, z));

          const color = palette[i % palette.length];
          colors.push(color.r, color.g, color.b);
          nodeSizes.push(THREE.MathUtils.randFloat(0.6, 1.6));
        }

        for (let i = 0; i < nodeVectors.length; i++) {
          const a = nodeVectors[i];
          for (let j = i + 1; j < Math.min(i + 10, nodeVectors.length); j++) {
            const b = nodeVectors[j];
            if (a.distanceTo(b) < 4.8) {
              linePositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
              const colorA = palette[i % palette.length];
              const colorB = palette[j % palette.length];
              lineColors.push(colorA.r, colorA.g, colorA.b, colorB.r, colorB.g, colorB.b);
            }
          }
        }

        const nodeGeo = new THREE.BufferGeometry();
        nodeGeo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        nodeGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        nodeGeo.setAttribute("size", new THREE.Float32BufferAttribute(nodeSizes, 1));

        const nodeMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0.0 } },
          vertexShader: `
            attribute float size;
            attribute vec3 color;
            varying vec3 vColor;
            uniform float uTime;
            void main() {
              vColor = color;
              vec3 pos = position;
              pos.y += sin(uTime * 0.9 + position.x * 0.4 + position.z * 0.4) * 0.25;
              vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
              gl_PointSize = size * (220.0 / -mvPosition.z);
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            varying vec3 vColor;
            void main() {
              vec2 uv = gl_PointCoord - vec2(0.5);
              float d = length(uv);
              if (d > 0.5) discard;
              float alpha = smoothstep(0.5, 0.0, d);
              gl_FragColor = vec4(vColor, alpha);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        nodesMesh = new THREE.Points(nodeGeo, nodeMat);
        scene.add(nodesMesh);

        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeo.setAttribute("color", new THREE.Float32BufferAttribute(lineColors, 3));

        connectionsMesh = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
          vertexColors: true, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending
        }));
        scene.add(connectionsMesh);
      }

      window.addEventListener("click", (event) => {
        const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), new THREE.MeshBasicMaterial({
          color: colorPalettes[0][Math.floor(Math.random() * colorPalettes[0].length)],
          transparent: true, opacity: 0.95
        }));
        pulse.position.copy(raycaster.ray.origin).add(raycaster.ray.direction.clone().multiplyScalar(12));
        scene.add(pulse);
        const start = performance.now();
        function animatePulse(now) {
          const progress = (now - start) / 700;
          if (progress >= 1) { scene.remove(pulse); return; }
          const scale = 1 + progress * 18;
          pulse.scale.set(scale, scale, scale);
          pulse.material.opacity = 0.95 * (1 - progress);
          requestAnimationFrame(animatePulse);
        }
        requestAnimationFrame(animatePulse);
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (nodesMesh && nodesMesh.material.uniforms?.uTime) {
          nodesMesh.material.uniforms.uTime.value = t;
          nodesMesh.rotation.y = Math.sin(t * 0.04) * 0.08;
        }
        if (connectionsMesh) connectionsMesh.rotation.y = Math.sin(t * 0.04) * 0.08;
        starField.rotation.y += 0.0002;
        if (starField.material.uniforms?.uTime) starField.material.uniforms.uTime.value = t;
        controls.update();
        composer.render();
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      createNetworkVisualization();
      animate();
    </script>
  </body>
</html>
